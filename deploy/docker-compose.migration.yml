services:
  postgres-migration:
    image: postgres:17-alpine
    container_name: loft-internship-postgres-migration
    restart: unless-stopped
    environment:
      POSTGRES_DB: loft_internship_migration
      POSTGRES_USER: loft_internship
      POSTGRES_PASSWORD: ${MIGRATION_POSTGRES_PASSWORD:?Set MIGRATION_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - loft-internship-postgres-migration-data:/var/lib/postgresql/data
    networks:
      default:
      loft-hall-internship-unified:
        aliases:
          - postgres-migration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loft_internship -d loft_internship_migration"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  loft-internship-postgres-migration-data:
    name: loft-internship-postgres-migration-data

networks:
  loft-hall-internship-unified:
    external: true
    name: loft-hall-internship-unified_default
