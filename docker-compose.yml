services:
  loft-internship-unified:
    build: .
    container_name: ${LOFT_INTERNSHIP_CONTAINER_NAME:-loft-internship-unified}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${LOFT_INTERNSHIP_HOST_PORT:-127.0.0.1:3500}:3000"
    volumes:
      - ./data:/app/data
    networks:
      - default
      - loft-hall-internship

networks:
  loft-hall-internship:
    external: true
    name: loft-hall-internship_default
