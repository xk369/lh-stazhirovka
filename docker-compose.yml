services:
  loft-internship-unified:
    build: .
    container_name: loft-internship-unified
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3500:3000"
    volumes:
      - ./data:/app/data
    networks:
      - default
      - loft-hall-internship

  loft-internship-notification-worker:
    build: .
    container_name: loft-internship-notification-worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "scripts/run-postgres-notification-worker.js"]
    volumes:
      - ./data:/app/data
    networks:
      - default
      - loft-hall-internship

networks:
  loft-hall-internship:
    external: true
    name: loft-hall-internship_default
